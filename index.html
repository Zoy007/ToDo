<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoya's To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <h1>✨ My To-Do List</h1>
      <button id="theme-toggle" title="Toggle dark mode">🌙</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-label">0% complete</span>
    </div>

    <form id="todo-form">
      <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off" required>
      <select id="priority-input" title="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="due-input" title="Due date">
      <button type="submit">Add</button>
    </form>

    <input type="text" id="search-input" placeholder="🔍 Search tasks...">

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <div class="footer">
      <span id="task-count">0 tasks left</span>
      <button id="clear-completed">Clear Completed</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
